spring.application.name=tripmates-backend-test
server.port=0

# MONGODB
spring.data.mongodb.uri=mongodb://mongo-user:mongo-password@localhost:27017/tripmates-test?authSource=admin

# NEO4J
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo-password

# LOGGING
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.neo4j=DEBUG

# SWAGGER
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# HEALTH
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.status.order=fatal,down,out-of-service,unknown,up

# MULTIPART
spring.servlet.multipart.enabled=false

spring.main.allow-bean-definition-overriding=true

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=dummy
