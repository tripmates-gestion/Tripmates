spring.application.name=tripmates-backend-test
server.port=0
spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration,org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
logging.level.org.springframework.security=DEBUG
# MONGODB
spring.data.mongodb.uri=mongodb://root:password@localhost:27017/testdb

# NEO4J
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo4j

# LOGGING
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.neo4j=DEBUG

# SWAGGER
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# HEALTH
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.status.order=fatal,down,out-of-service,unknown,up
