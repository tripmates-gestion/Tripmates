spring.application.name=tripmates-backend
server.port=${BACKEND_PORT}

# MONGODB
spring.data.mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:${MONGO_PORT}/${MONGO_INITDB_DATABASE}?authSource=admin

# NEO4J
spring.neo4j.uri=bolt://neo4j:${NEO4J_BOLT_PORT}
spring.neo4j.authentication.username=${NEO4J_USER}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# LOGGING
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.neo4j=DEBUG

# SWAGGER
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# HEALTH
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.status.order=fatal,down,out-of-service,unknown,up

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB