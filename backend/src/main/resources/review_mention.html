<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>¡Fuiste mencionado en una review!</title>
    <style>
        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            background-color: #f7f7f7;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        p, h2 {
            text-align: center;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body style="font-family:Helvetica, Arial, sans-serif; background:#f7f7f7; padding:20px; text-align:center; margin:0;">
<table
        style="max-width:480px; margin:auto; background:#ffffff; border-radius:8px; padding:20px; text-align:center; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
    <tr>
        <td style="text-align:center; padding-bottom:15px;">
            <img src="https://res.cloudinary.com/dpkgudvtt/image/upload/v1763524833/6-pinguinos_hmcrb1.png"
                 alt="Logo Tripmates" width="100" style="display:block; margin:0 auto;" />
        </td>
    </tr>
    <tr>
        <td style="padding:20px; font-size:16px; color:#000; text-align:center;">
            <h2 style="font-size:24px; color:#333; margin-bottom: 20px;">¡Fuiste mencionado en una review!</h2>

            <p style="margin:10px 0; font-size:18px; font-weight: bold;">Hola {{ toUsername }},</p>

            <p style="margin:20px 0; line-height: 1.5; color:#555;">
                {{ ownerUsername }} te mencionó en una review sobre:
            </p>

            <p style="margin:20px 0; line-height: 1.5; color:#333; font-weight: bold; padding: 10px; background-color: #f0f0f0; border-radius: 4px;">
                {{ publicationTitle }}
            </p>

            <blockquote style="font-style: italic; color: #555; margin: 0 0 20px 0;">
                {{ reviewSnippet }}
            </blockquote>

            <p style="margin:30px 0 10px 0; color:#888;">
                ¡Nos vemos en Tripmates!
            </p>
        </td>
    </tr>
    <tr>
        <td
                style="padding:20px 20px 10px 20px; font-size:14px; color:#888; text-align:center; border-top:1px solid #eee; margin-top:20px;">
            <p style="margin:5px 0;">Saludos,</p>
            <p style="margin:5px 0;">El equipo de Tripmates</p>
            <p style="margin-top:10px; font-size:12px; color:#aaa;">Si recibiste este correo por error, puedes ignorarlo.</p>
        </td>
    </tr>
</table>
</body>

</html>
