services:
  neo4j:
    image: neo4j:4.4.29-community
    container_name: tripmates-neo4j
    restart: unless-stopped
    env_file: .env
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_dbms_connector_bolt_advertised__address: ":7687"
      NEO4J_dbms_connector_http_advertised__address: ":7474"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - tripmates-neo4j-data:/data
      - tripmates-neo4j-logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0
    container_name: ${MONGO_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - tripmates-mongo-data:/data/db
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 7

  backend:
    build: .
    container_name: tripmates-backend
    restart: "on-failure:3"
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_PORT: ${MONGO_PORT}

      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_BOLT_PORT: ${NEO4J_BOLT_PORT}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      

      BACKEND_PORT: ${BACKEND_PORT}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      SPRING_PROFILES_ACTIVE: dev
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      FRONTEND_URL_BASE: http://localhost:5173
    ports:
      - "${BACKEND_PORT-8080}:${BACKEND_PORT-8080}"
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${BACKEND_PORT}/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - tripmates-backend-data:/data
    

volumes:
  tripmates-neo4j-data:
  tripmates-neo4j-logs:
  tripmates-mongo-data:
  tripmates-backend-data:
